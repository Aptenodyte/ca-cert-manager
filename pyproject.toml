[project]
name = "rootwatch"
version = "0.1.0"
description = "System-wide CA distrust manager: audit fragmented trust stores, remediate compromised roots, prove it with real TLS handshakes."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rootwatch = "rootwatch.cli:main"
rootwatch-web = "rootwatch.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rootwatch*"]
